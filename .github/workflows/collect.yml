name: Preise sammeln

on:
  schedule:
    - cron: '17 6 * * *'     # täglich um 06:17 UTC (Cardmarket aktualisiert die Liste nachts)
  workflow_dispatch: {}      # zusätzlich per Knopf "Run workflow" startbar

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Preise abrufen
        run: python3 scripts/collect.py
      - name: Speichern
        run: |
          git config user.name "Preis-Archiv"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Preise $(date -u +%F)"
          git push
